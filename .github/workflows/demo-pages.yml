# Publishes https://mrsaiyed.github.io/league-platform/: the live stats site at the root,
# the concept demo under /demo/.
#
# The site is built from ONE FIXED COMMIT, the "ref:" line below, not from the newest
# main. Ordinary pushes to main do not run this workflow at all: it runs only when this
# file changes (or by hand from the Actions tab), and then it builds that same commit. So
# main can follow the build every day while the live tracker stays exactly as it is.
#
# Changing the "ref:" line is a release of the live tracker. Only the technical lead makes
# one, with `node scripts/promote-to-main.mjs --release-tracker=<commit>`, never around a
# game (docs/build/RUNBOOK.md, sections 6 and 7). tests/promote-rules.test.mjs fails if this file
# stops naming one full commit or starts running on every push.
#
# The live stats pages save to Supabase. Its address and public key come from the
# repository variables SUPABASE_URL and SUPABASE_ANON_KEY (Settings → Secrets and
# variables → Actions → Variables). Both are public by design; never put the secret
# (service_role) key here: the build refuses it. Without them the site says it is not
# connected yet. After setting or changing them, run this workflow again.
name: Publish site
on:
  push:
    branches: [main]
    paths: ['.github/workflows/demo-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: concept-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The released version of the live site: the commit it was last published from
          # before this line existed (2026-11-13).
          ref: 0259e87af1b46b37c4c72c228f11b4c85dc75c8b
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build:pages
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
