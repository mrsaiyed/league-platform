name: Verify
on: [push, pull_request]
permissions:
  contents: read
env:
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # The output also goes to a file, so the next step can say what failed.
      - name: npm run verify
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee "$RUNNER_TEMP/verify-output.txt"
      - name: Say what failed in verify
        if: failure()
        shell: bash
        run: node scripts/verify-failure-notes.mjs "$RUNNER_TEMP/verify-output.txt"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:varsity:browser
      - run: npm run test:stats:browser
      - run: npm run test:pages:browser
      # The web app's browser tests, one at a time in package.json's order, each under its
      # own heading, the output also kept in a file: so when one fails, the next step can
      # name its test file and give the failing check's lines.
      - name: npm run test:web:browser
        id: web-browser
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-failure-notes.mjs --steps test:web:browser > "$RUNNER_TEMP/web-browser-tests.txt"
          while IFS= read -r test; do
            echo "::group::$test"
            bash -c "$test" < /dev/null || exit 1
            echo "::endgroup::"
          done < "$RUNNER_TEMP/web-browser-tests.txt" 2>&1 | tee "$RUNNER_TEMP/web-browser-output.txt"
      - name: Say what failed in the web app's browser tests
        if: failure() && steps.web-browser.outcome == 'failure'
        shell: bash
        run: node scripts/verify-failure-notes.mjs --web-browser "$RUNNER_TEMP/web-browser-output.txt"
  hosted-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/varsity-hosted/package-lock.json
      - run: npm ci
      - run: npm run prepare:varsity:hosted
      - run: npm --prefix apps/varsity-hosted ci
      - run: node node_modules/typescript/bin/tsc --noEmit
        working-directory: apps/varsity-hosted
      - run: npm run build
        working-directory: apps/varsity-hosted
