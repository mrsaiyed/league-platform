<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Al-Hadi Varsity · Game day</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" href="/logo.png" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="header">
      <a class="brand" href="#overview"
        ><img src="/logo.png" alt="Al-Hadi Lions" /><span
          ><strong>AL-HADI</strong><small>VARSITY BASKETBALL</small></span
        ></a
      >
      <nav aria-label="Team navigation">
        <a href="#overview">Overview</a><a href="#games">Games</a><a href="#roster">Roster</a
        ><a href="#stats">Season stats</a>
      </nav>
      <span class="preview-tag">Game-day preview</span>
    </header>
    <div class="storage-bar">
      <span><i></i> Local rehearsal · records saved on this computer</span
      ><span id="save-status" role="status" aria-live="polite">Connecting…</span>
    </div>
    <main id="main" tabindex="-1"><p class="loading">Opening the team workspace…</p></main>
    <div id="notice" class="notice" role="alert" hidden></div>
    <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-body"></div></dialog>
    <footer>
      Al-Hadi team records · TCSAAL fixtures are an external source · Practice games stay separate
      from season totals
    </footer>
    <script type="module" src="/app.js"></script>
  </body>
</html>
