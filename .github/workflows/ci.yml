name: Verify
on: [push, pull_request]
permissions:
  contents: read
env:
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # The output also goes to a file, so the next step can say what failed.
      - name: npm run verify
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee "$RUNNER_TEMP/verify-output.txt"
      - name: Say what failed in verify
        if: failure()
        shell: bash
        run: node scripts/verify-failure-notes.mjs "$RUNNER_TEMP/verify-output.txt"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:varsity:browser
      - run: npm run test:stats:browser
      - run: npm run test:pages:browser
      # As for verify: the output also goes to a file, so the next step can say what failed.
      # npm runs the chain in bash with its trace on, so bash prints "+ node tests/browser/…"
      # before each test starts, and the notes can name the test that stopped (step 2.178).
      - name: npm run test:web:browser
        id: web-browser
        shell: bash
        run: |
          set -o pipefail
          env SHELLOPTS=xtrace npm_config_script_shell=bash npm run test:web:browser 2>&1 | tee "$RUNNER_TEMP/web-browser-output.txt"
      - name: Say what failed in the browser tests
        if: failure() && steps.web-browser.outcome == 'failure'
        shell: bash
        run: node scripts/browser-failure-notes.mjs "$RUNNER_TEMP/web-browser-output.txt"
  hosted-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/varsity-hosted/package-lock.json
      - run: npm ci
      - run: npm run prepare:varsity:hosted
      - run: npm --prefix apps/varsity-hosted ci
      - run: node node_modules/typescript/bin/tsc --noEmit
        working-directory: apps/varsity-hosted
      - run: npm run build
        working-directory: apps/varsity-hosted
